<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SK B2C Warehouse</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a56db">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c12;--bg2:#0f1520;--bg3:#161e2e;--bg4:#1d2840;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --t:#eef2f7;--t2:#b4bfcc;--t3:#6b7a8d;
  --blue:#3b82f6;--blue2:#2563eb;--blue-bg:rgba(59,130,246,.1);--blue-bd:rgba(59,130,246,.28);
  --green:#22c55e;--green-bg:rgba(34,197,94,.1);--green-bd:rgba(34,197,94,.28);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,.1);--amber-bd:rgba(245,158,11,.28);
  --red:#ef4444;--red-bg:rgba(239,68,68,.08);--red-bd:rgba(239,68,68,.28);
  --purple:#a855f7;--purple-bg:rgba(168,85,247,.1);--purple-bd:rgba(168,85,247,.28);
  --teal:#14b8a6;--teal-bg:rgba(20,184,166,.1);--teal-bd:rgba(20,184,166,.28);
  --cyan:#06b6d4;
  --font:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--r2:12px;--r3:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);background:var(--bg);color:var(--t);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
/* ── Layout ── */
.shell{max-width:1360px;margin:0 auto;padding:0 24px 90px}
@media(max-width:800px){.shell{padding:0 12px 90px}}
/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd);margin-bottom:12px;position:sticky;top:0;background:var(--bg);z-index:100;gap:8px;flex-wrap:wrap}
.hdr-brand{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:-.1px;color:var(--t)}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-clock{font-family:var(--mono);font-size:11px;color:var(--t3)}
.sync{width:7px;height:7px;border-radius:50%;background:var(--green);transition:background .3s;flex-shrink:0}
.sync.busy{background:var(--amber);animation:pp 1s infinite}.sync.fail{background:var(--red)}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.2}}
.worker-sel{background:var(--bg3);border:1px solid var(--bd2);border-radius:var(--r);color:var(--t);padding:6px 10px;font-family:var(--font);font-size:13px;cursor:pointer;outline:none;max-width:150px}
.worker-sel:focus{border-color:var(--blue)}
/* ── Nav ── */
.nav{display:flex;gap:2px;background:var(--bg2);border-radius:var(--r2);padding:3px;margin-bottom:14px;position:sticky;top:48px;z-index:99;border:1px solid var(--bd)}
.nb{flex:1;padding:8px 4px;border:none;background:transparent;color:var(--t3);font-family:var(--font);font-size:10px;font-weight:700;cursor:pointer;border-radius:var(--r);transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;letter-spacing:.03em;white-space:nowrap}
.nb i{font-size:16px}.nb:hover{color:var(--t2);background:var(--bg3)}.nb.on{background:var(--blue);color:#fff}
.nb-badge{position:absolute;top:3px;right:5px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 4px;min-width:14px;text-align:center;line-height:1.4}
/* ── Pages ── */
.pg{display:none}.pg.on{display:block;animation:fu .16s ease}
@keyframes fu{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* ── Grid ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:900px){.g5,.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.g2,.g3{grid-template-columns:1fr}.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}}
/* ── Metric cards ── */
.mc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:12px 14px;position:relative;overflow:hidden}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.mc.bl::before{background:var(--blue)}.mc.gr::before{background:var(--green)}.mc.am::before{background:var(--amber)}
.mc.pu::before{background:var(--purple)}.mc.tl::before{background:var(--teal)}.mc.cy::before{background:var(--cyan)}.mc.rd::before{background:var(--red)}
.mc-l{font-size:10px;color:var(--t3);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.mc-v{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.2}
/* ── Card ── */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r2);padding:14px 16px;margin-bottom:10px}
.card-t{font-weight:700;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.section{font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.section::after{content:'';flex:1;height:1px;background:var(--bd)}
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-pick{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.b-insp{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd)}
.b-pall{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-bd)}
.b-done{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.b-wait{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.b-live{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);animation:pulse 2s infinite}
.b-saving{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* ── Stage pills ── */
.srow{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.sp{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid var(--bd);white-space:nowrap}
.sp-wait{background:var(--bg3);color:var(--t3)}
.sp-pick{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.sp-insp{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bd)}
.sp-pall{background:var(--teal-bg);color:var(--teal);border-color:var(--teal-bd)}
.sp-done{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.sp-arr{color:var(--t3);font-size:10px}
/* ── Stage tabs — redesigned ── */
.stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.stab{padding:12px 8px;border-radius:var(--r2);border:1px solid var(--bd2);background:var(--bg3);color:var(--t3);font-weight:700;cursor:pointer;text-align:center;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;position:relative}
.stab:hover{border-color:var(--t3);color:var(--t2)}
.stab.pick.on{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue);box-shadow:0 0 0 1px var(--blue-bd)}
.stab.insp.on{background:var(--purple-bg);border-color:var(--purple-bd);color:var(--purple);box-shadow:0 0 0 1px var(--purple-bd)}
.stab.pall.on{background:var(--teal-bg);border-color:var(--teal-bd);color:var(--teal);box-shadow:0 0 0 1px var(--teal-bd)}
/* active dot on tab */
.stab-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
/* stage content panels */
.stage-panel{animation:fu .16s ease}
/* start card */
.start-card{background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r3);padding:18px 20px;margin-bottom:12px}
.start-card.pick{border-color:var(--blue-bd)}
.start-card.insp{border-color:var(--purple-bd)}
.start-card.pall{border-color:var(--teal-bd)}
/* active session card — stage-colored */
.session-card{background:var(--bg2);border-radius:var(--r2);padding:16px 18px;margin-bottom:10px;border-left:4px solid var(--bd2)}
.session-card.pick{border-left-color:var(--blue);background:linear-gradient(135deg,rgba(59,130,246,.04),var(--bg2))}
.session-card.insp{border-left-color:var(--purple);background:linear-gradient(135deg,rgba(168,85,247,.04),var(--bg2))}
.session-card.pall{border-left-color:var(--teal);background:linear-gradient(135deg,rgba(20,184,166,.04),var(--bg2))}
.session-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.session-title{font-family:var(--mono);font-weight:700;font-size:15px}
.session-sub{font-size:11px;color:var(--t2);margin-top:2px}
.session-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg3);border:1px solid var(--bd2);color:var(--t2)}
.chip.hi{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}
/* activity feed rows */
.act-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px}
.act-row:last-child{border-bottom:none}
.act-stage{font-weight:700;font-size:10px;width:38px;flex-shrink:0;letter-spacing:.04em}
/* ── Buttons ── */
.btn{padding:8px 14px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg3);color:var(--t);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{background:var(--bg4);border-color:var(--t3)}.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-blue:hover{background:var(--blue2)}
.btn-green{background:var(--green);color:#000;border-color:var(--green)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-purple{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-teal{background:var(--teal);color:#000;border-color:var(--teal)}
.btn-amber{background:var(--amber);color:#000;border-color:var(--amber)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-lg{padding:14px 20px;font-size:14px;font-weight:700;border-radius:var(--r2)}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.28;cursor:not-allowed;pointer-events:none}
.btn.saving::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:sh 1s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* ── Forms ── */
.fg{margin-bottom:10px}
.fl{display:block;font-size:11px;color:var(--t2);margin-bottom:3px;font-weight:600;letter-spacing:.02em}
.fi{width:100%;padding:9px 12px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg3);color:var(--t);font-family:var(--font);font-size:13px;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fi::placeholder{color:var(--t3)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:440px){.frow{grid-template-columns:1fr}}
/* ── Table ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10px;color:var(--t3);padding:7px 9px;border-bottom:1px solid var(--bd2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.011)}
.mono{font-family:var(--mono);font-size:11px;font-weight:500}
/* ── Work entry card ── */
.we{background:var(--bg3);border:1px solid var(--bd2);border-radius:var(--r2);padding:14px 16px;margin-bottom:8px;transition:border-color .2s,opacity .2s}
.we.pending{border-color:var(--amber-bd);opacity:.88}
.we-header{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.we-title{font-family:var(--mono);font-weight:700;font-size:13px}
.we-sub{font-size:11px;color:var(--t2);margin-top:2px}
.we-meta{display:flex;gap:10px;font-size:11px;color:var(--t3);flex-wrap:wrap;margin-top:5px}
.we-meta i{font-size:12px}
/* ── Activity row ── */
.act-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px}
.act-row:last-child{border-bottom:none}
.act-stage{font-weight:700;font-size:11px;width:36px;flex-shrink:0}
/* ── End modal ── */
.end-modal-inner{text-align:center;padding:4px 0}
.pallet-input{font-size:36px;font-weight:800;text-align:center;font-family:var(--mono);width:140px;margin:0 auto}
/* ── KPI filters ── */
.kpi-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi-bar label{font-size:11px;color:var(--t2);font-weight:600}
.kpi-bar .fi{width:130px;padding:6px 9px;font-size:12px}
/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:14px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r3);width:100%;max-width:400px;max-height:88vh;overflow-y:auto;padding:22px}
/* ── Toast ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--bd2);color:var(--t);padding:9px 20px;border-radius:var(--r2);font-size:13px;font-weight:600;opacity:0;transition:all .28s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);background:rgba(34,197,94,.1)}.toast.err{border-color:var(--red);background:rgba(239,68,68,.1)}
/* ── Loading ── */
.loading{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spinner{width:30px;height:30px;border:3px solid var(--bd2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Live timer on active cards ── */
.elapsed-timer{color:var(--amber);font-weight:600;display:flex;align-items:center;gap:3px}
.elapsed-timer i{animation:tick 2s infinite}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.4}}
.empty{text-align:center;padding:26px 16px;color:var(--t3);font-size:12px}
.empty i{font-size:26px;display:block;margin-bottom:5px;opacity:.3}
</style>
</head>
<body>

<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <div style="font-size:12px;color:var(--t2)">Loading warehouse system...</div>
</div>

<div class="shell" style="display:none" id="app">
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-brand">STYLEKOREAN_NJ / MOIDA</div>
    <div class="hdr-right">
      <div class="hdr-clock" id="clock"></div>
      <span class="sync" id="syncDot"></span>
      <select class="worker-sel" id="workerSel" onchange="onWorkerChange()"></select>
      <button class="btn btn-sm" onclick="refreshData()" title="Refresh"><i class="ri-refresh-line"></i></button>
    </div>
  </header>

  <!-- Nav -->
  <nav class="nav">
    <button class="nb on" data-p="dash"><i class="ri-dashboard-3-line"></i>Dashboard</button>
    <button class="nb" data-p="work"><i class="ri-play-circle-line"></i>Work</button>
    <button class="nb" data-p="kpi"><i class="ri-bar-chart-2-line"></i>KPI</button>
    <button class="nb" data-p="mgr"><i class="ri-shield-keyhole-line"></i>Manager</button>
  </nav>

  <!-- DASHBOARD -->
  <div class="pg on" id="pg-dash">
    <div id="dashMetrics" style="margin-bottom:12px"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap">
      <div id="dashFilterTabs" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      <div style="flex:1"></div>
      <div style="position:relative;min-width:180px">
        <i class="ri-search-line" style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px"></i>
        <input class="fi" id="dashSearch" placeholder="Order / channel / customer" style="padding-left:30px;font-size:12px" oninput="_dp=0;renderDashTable()">
      </div>
    </div>
    <div id="dashTable"></div>
    <div id="dashPager" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:7px"></div>
  </div>

  <!-- WORK — completely redesigned: stage-focused -->
  <div class="pg" id="pg-work">

    <!-- ① Stage status bar — 내 현재 상태 한눈에 -->
    <div id="stageStatusBar" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px"></div>

    <!-- ② Stage tab selector -->
    <div class="stabs" id="stageTabs">
      <div class="stab pick on" onclick="selStage('PICK')">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:100%">
          <div style="display:flex;align-items:center;gap:5px;font-size:13px"><i class="ri-route-line"></i> PICKING</div>
          <div class="stab-status" id="stabStatus_PICK" style="font-size:10px;font-weight:400;opacity:.7"></div>
        </div>
      </div>
      <div class="stab insp" onclick="selStage('INSP')">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:100%">
          <div style="display:flex;align-items:center;gap:5px;font-size:13px"><i class="ri-search-eye-line"></i> INSPECTION</div>
          <div class="stab-status" id="stabStatus_INSP" style="font-size:10px;font-weight:400;opacity:.7"></div>
        </div>
      </div>
      <div class="stab pall" onclick="selStage('PALL')">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:100%">
          <div style="display:flex;align-items:center;gap:5px;font-size:13px"><i class="ri-stack-line"></i> PALLETIZING</div>
          <div class="stab-status" id="stabStatus_PALL" style="font-size:10px;font-weight:400;opacity:.7"></div>
        </div>
      </div>
    </div>

    <!-- ③ Stage content area — changes per tab -->
    <div id="stageContent"></div>

  </div>

  <!-- KPI -->
  <div class="pg" id="pg-kpi">
    <div class="kpi-bar">
      <label>From</label><input class="fi" type="date" id="kpiFrom">
      <label>To</label><input class="fi" type="date" id="kpiTo">
      <button class="btn btn-blue btn-sm" onclick="renderKPI()"><i class="ri-filter-line"></i> Apply</button>
      <button class="btn btn-sm" onclick="kpiToday()">Today</button>
      <button class="btn btn-sm" onclick="kpiWeek()">This week</button>
      <button class="btn btn-sm" onclick="kpiMonth()">This month</button>
    </div>
    <div id="kpiContent"></div>
  </div>

  <!-- MANAGER -->
  <div class="pg" id="pg-mgr">
    <div class="g2" style="margin-bottom:10px">
      <div class="card">
        <div class="card-t"><i class="ri-user-settings-line" style="color:var(--amber)"></i> Workers</div>
        <div style="display:flex;gap:7px;margin-bottom:9px">
          <input class="fi" id="newWorker" placeholder="New worker name" style="flex:1">
          <button class="btn btn-blue btn-sm" onclick="addWorker()"><i class="ri-user-add-line"></i> Add</button>
        </div>
        <div id="workerList"></div>
      </div>
      <div class="card">
        <div class="card-t"><i class="ri-file-list-3-line" style="color:var(--blue)"></i> Orders</div>
        <div class="fg"><label class="fl">Order number</label><input class="fi" id="newOrderId" placeholder="e.g. IM003232"></div>
        <div class="frow">
          <div class="fg"><label class="fl">Channel</label><input class="fi" id="newOrderCh" placeholder="e.g. NJ"></div>
          <div class="fg"><label class="fl">Customer</label><input class="fi" id="newOrderCu" placeholder="e.g. MOIDA"></div>
        </div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — update API_URL after redeploying Code.gs
// ═══════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbw-rEUoQz5c38k0I7P6ykyhEFfZ5P4tGf0wF4zc96742O8KVlpB7-3Unh6W6S7RQctAjA/exec';

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let S = { orders:[], works:[], workers:[], pin:'1234' };
let CW = '';           // current worker
let CS = 'PICK';       // current stage
let _mgrOK = false;
let _pending = {};     // entryId → true (in-flight)
let _syncN = 0;
let _dp = 0;           // dashboard page

// ═══════════════════════════════════════════════
// JSONP / API
// ═══════════════════════════════════════════════
let _jc = 0;
function apiCall(url){
  return new Promise((res,rej)=>{
    const cb='_j'+(++_jc)+'_'+Date.now();
    const sc=document.createElement('script');
    const to=setTimeout(()=>{cleanup();rej(new Error('Timeout'));},30000);
    function cleanup(){clearTimeout(to);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);}
    window[cb]=d=>{cleanup();res(d);};
    sc.onerror=()=>{cleanup();rej(new Error('Network error'));};
    sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(sc);
  });
}

function setSyncing(on){
  const d=document.getElementById('syncDot');if(!d)return;
  d.className='sync'+(on?' busy':'');
}
function setSyncFail(){
  const d=document.getElementById('syncDot');if(!d)return;
  d.className='sync fail';setTimeout(()=>d.className='sync',4000);
}

// background fire-and-forget
async function apiBg(op,data,onOk,onErr){
  _syncN++;setSyncing(true);
  try{
    const url=API_URL+'?op='+encodeURIComponent(op)+'&data='+encodeURIComponent(JSON.stringify(data||{}));
    const r=await apiCall(url);
    if(r&&r.ok){if(onOk)onOk(r);}
    else{setSyncFail();if(onErr)onErr(r);}
    return r;
  }catch(e){setSyncFail();if(onErr)onErr({error:e.message});return{ok:false};}
  finally{_syncN--;if(_syncN<=0){_syncN=0;setSyncing(false);}}
}

async function apiGet(op){
  try{return await apiCall(API_URL+'?op='+op);}
  catch(e){return{ok:false,error:e.message};}
}

async function loadData(){
  const r=await apiGet('listAll');
  if(r.ok){
    S.orders=r.orders||[];
    S.workers=r.workers||[];
    S.pin=r.pin||'1234';
    // Normalize works — handle legacy entries missing stage field
    S.works=(r.works||[]).map(w=>({
      ...w,
      stage: w.stage&&['PICK','INSP','PALL'].includes(w.stage) ? w.stage : 'PICK',
      items:  w.items  !== null && w.items  !== undefined ? w.items  : null,
      qty:    w.qty    !== null && w.qty    !== undefined ? w.qty    : null,
      pallets:w.pallets!== null && w.pallets!== undefined ? w.pallets: null,
      netMin: w.netMin !== null && w.netMin !== undefined ? w.netMin : null,
    }));
  }
  return r.ok;
}

async function refreshData(){
  toast('Refreshing...','');
  const ok=await loadData();
  popWorker();go(curPage());updateBadges();
  toast(ok?'Refreshed ✓':'Refresh failed','ok');
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function toast(m,c){
  const t=document.getElementById('toast');t.textContent=m;
  t.className='toast show'+(c?' '+c:'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2800);
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBg').classList.add('show');}

function updateClock(){
  const d=new Date();
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock').textContent=D[d.getDay()]+' '+M[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' · '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

function nowHHmm(){
  try{return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Los_Angeles'});}
  catch(e){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
}
function todayStr(){
  try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}
  catch(e){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
}
function genId(){return'W'+Date.now()+Math.floor(Math.random()*999);}

// net minutes client-side (for immediate display)
function clientNet(sHHmm,eHHmm){
  if(!sHHmm||!eHHmm)return null;
  const[sh,sm]=sHHmm.split(':').map(Number),[eh,em]=eHHmm.split(':').map(Number);
  const s=sh*60+sm,e=eh*60+em;
  if(e<=s)return null;
  const gross=e-s;
  const overlap=Math.max(0,Math.min(e,13*60)-Math.max(s,12*60));
  return Math.max(0,gross-overlap);
}
function fmtMin(m){
  if(m===null||m===undefined||m==='')return'—';
  const n=Number(m);if(isNaN(n))return'—';
  if(n<60)return n+'m';return Math.floor(n/60)+'h '+(n%60)+'m';
}

function popWorker(){
  const sel=document.getElementById('workerSel'),cur=sel.value;
  sel.innerHTML=S.workers.map(w=>`<option${w===cur?' selected':''}>${w}</option>`).join('');
  if(!cur&&S.workers.length)sel.value=S.workers[0];
  CW=sel.value;
}
function onWorkerChange(){CW=document.getElementById('workerSel').value;_mgrOK=false;go(curPage());}

function updateBadges(){
  const n=S.works.filter(w=>w.w===CW&&!w.endT).length;
  const btn=document.querySelector('[data-p="work"]');if(!btn)return;
  let b=btn.querySelector('.nb-badge');
  if(n>0){if(!b){b=document.createElement('span');b.className='nb-badge';btn.appendChild(b);}b.textContent=n;}
  else if(b)b.remove();
}

// ═══════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════
function go(id){
  if(id==='mgr'&&!_mgrOK){showPin();return;}
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const pg=document.getElementById('pg-'+id);if(pg)pg.classList.add('on');
  const nb=document.querySelector(`[data-p="${id}"]`);if(nb)nb.classList.add('on');
  R[id]?.();
}
function curPage(){const a=document.querySelector('.nb.on');return a?a.dataset.p:'dash';}

function showPin(){
  openModal(`<div style="text-align:center;padding:6px 0">
    <i class="ri-shield-keyhole-line" style="font-size:30px;color:var(--amber);display:block;margin-bottom:8px"></i>
    <div style="font-size:15px;font-weight:700;margin-bottom:3px">Manager access</div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:14px">Enter password</div>
    <input class="fi pallet-input" type="password" id="pinIn" style="letter-spacing:6px;margin:0 auto 10px;display:block" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()">
    <div id="pinErr" style="font-size:11px;color:var(--red);min-height:15px;margin-bottom:10px"></div>
    <div style="display:flex;gap:7px;justify-content:center">
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue btn-sm" onclick="checkPin()"><i class="ri-lock-unlock-line"></i> Unlock</button>
    </div></div>`);
  setTimeout(()=>document.getElementById('pinIn')?.focus(),80);
}
function checkPin(){
  const v=document.getElementById('pinIn')?.value||'';
  if(v===S.pin){_mgrOK=true;closeModal();toast('Manager unlocked','ok');go('mgr');}
  else{document.getElementById('pinErr').textContent='Incorrect password';const i=document.getElementById('pinIn');if(i){i.value='';i.focus();}}
}

// ═══════════════════════════════════════════════
// RENDERERS
// ═══════════════════════════════════════════════
const R={};

// stage color/label helpers
const SCOL   = {PICK:'var(--blue)',  INSP:'var(--purple)',  PALL:'var(--teal)'};
const SBDCOL = {PICK:'var(--blue-bd)',INSP:'var(--purple-bd)',PALL:'var(--teal-bd)'};
const SBTN   = {PICK:'btn-blue',     INSP:'btn-purple',     PALL:'btn-teal'};
const SLABEL = {PICK:'Start Picking',INSP:'Start Inspection',PALL:'Start Palletizing'};
const SELABEL= {PICK:'End Picking',  INSP:'End Inspection',  PALL:'End Palletizing'};
const SICON  = {PICK:'ri-route-line',INSP:'ri-search-eye-line',PALL:'ri-stack-line'};
const SBGCLS = {PICK:'pick',         INSP:'insp',            PALL:'pall'};

// ── helpers ──
function orderStageSummary(oid){
  const ws=S.works.filter(w=>w.oid===oid);
  const byStage=s=>ws.filter(w=>w.stage===s);
  return{PICK:byStage('PICK'),INSP:byStage('INSP'),PALL:byStage('PALL')};
}

function stagePills(oid){
  const a=orderStageSummary(oid);
  return`<div class="srow">${['PICK','INSP','PALL'].map((s,i)=>{
    const ws=a[s];
    const active=ws.filter(w=>!w.endT).length;
    const done=ws.filter(w=>w.endT).length;
    let cls='sp-wait';
    if(active>0)cls=`sp-${s.toLowerCase()}`;
    else if(done>0)cls='sp-done';
    const cnt=ws.length?` (${done}/${ws.length})`:'';
    return(i>0?'<span class="sp-arr">→</span>':'')+`<div class="sp ${cls}">${s}${cnt}</div>`;
  }).join('')}</div>`;
}

// ── DASHBOARD ──
const D_PER=20;
let _dFilter='all';

R.dash=function(){
  // Count by status
  let wait=0,pickA=0,inspA=0,pallA=0,done=0,mixed=0;
  S.orders.forEach(o=>{
    const a=orderStageSummary(o.id);
    const anyWork=a.PICK.length||a.INSP.length||a.PALL.length;
    if(!anyWork){wait++;return;}
    const anyActive=Object.values(a).some(ws=>ws.some(w=>!w.endT));
    const allEnded=Object.values(a).every(ws=>ws.every(w=>w.endT));
    if(allEnded&&a.PALL.filter(w=>w.endT).length>0){done++;return;}
    if(a.PALL.some(w=>!w.endT))pallA++;
    else if(a.INSP.some(w=>!w.endT))inspA++;
    else if(a.PICK.some(w=>!w.endT))pickA++;
    else mixed++;
  });

  document.getElementById('dashMetrics').innerHTML=`<div class="g6">
    ${[{l:'Waiting',v:wait,c:'am'},{l:'Picking',v:pickA,c:'bl'},{l:'Inspection',v:inspA,c:'pu'},
       {l:'Palletizing',v:pallA,c:'tl'},{l:'Completed',v:done,c:'gr'},{l:'Total',v:S.orders.length,c:'cy'}]
    .map(m=>`<div class="mc ${m.c}"><div class="mc-l">${m.l}</div><div class="mc-v" style="color:var(--${{am:'amber',bl:'blue',pu:'purple',tl:'teal',gr:'green',cy:'cyan'}[m.c]})">${m.v}</div></div>`).join('')}</div>`;
  renderDashTable();
};

function renderDashTable(){
  const tabs=[{k:'all',l:'All'},{k:'active',l:'Active'},{k:'done',l:'Done'},{k:'waiting',l:'Waiting'}];
  document.getElementById('dashFilterTabs').innerHTML=tabs.map(t=>
    `<button class="btn btn-sm" style="${_dFilter===t.k?'background:var(--bg4);border-color:var(--t3)':'color:var(--t3)'}" onclick="_dFilter='${t.k}';_dp=0;renderDashTable()">${t.l}</button>`).join('');

  let rows=S.orders;
  if(_dFilter==='active')rows=rows.filter(o=>Object.values(orderStageSummary(o.id)).some(ws=>ws.some(w=>!w.endT)));
  else if(_dFilter==='done')rows=rows.filter(o=>{const a=orderStageSummary(o.id);const any=a.PICK.length||a.INSP.length||a.PALL.length;return any&&Object.values(a).every(ws=>ws.every(w=>w.endT))&&a.PALL.some(w=>w.endT);});
  else if(_dFilter==='waiting')rows=rows.filter(o=>{const a=orderStageSummary(o.id);return!a.PICK.length&&!a.INSP.length&&!a.PALL.length;});

  const sq=(document.getElementById('dashSearch')?.value||'').toUpperCase();
  if(sq)rows=rows.filter(o=>{const ws=S.works.filter(w=>w.oid===o.id);return o.id.toUpperCase().includes(sq)||o.ch.toUpperCase().includes(sq)||o.cu.toUpperCase().includes(sq)||ws.some(w=>w.w.toUpperCase().includes(sq));});

  const total=rows.length,pages=Math.max(1,Math.ceil(total/D_PER));
  if(_dp>=pages)_dp=pages-1;if(_dp<0)_dp=0;
  const slice=rows.slice(_dp*D_PER,_dp*D_PER+D_PER);

  if(!slice.length){document.getElementById('dashTable').innerHTML='<div class="empty"><i class="ri-inbox-line"></i>No orders found</div>';document.getElementById('dashPager').innerHTML='';return;}

  const trs=slice.map(o=>{
    const ws=S.works.filter(w=>w.oid===o.id);
    const workers=[...new Set(ws.map(w=>w.w))];
    const totalItems=ws.filter(w=>w.stage==='PICK').reduce((s,w)=>s+(w.items||0),0);
    const totalQty  =ws.filter(w=>w.stage==='PICK').reduce((s,w)=>s+(w.qty||0),0);
    const totalPallets=ws.filter(w=>w.stage==='PALL'&&w.endT&&w.pallets!==null).reduce((s,w)=>s+(w.pallets||0),0);
    const totalNet  =ws.filter(w=>w.endT&&w.netMin!==null).reduce((s,w)=>s+(w.netMin||0),0);
    const isMe=ws.some(w=>w.w===CW);
    return`<tr${isMe?' style="background:rgba(59,130,246,.03)"':''}>
      <td class="mono" style="font-weight:700;padding-left:12px">${o.id}</td>
      <td style="color:var(--t2)">${o.ch}</td><td style="color:var(--t2)">${o.cu}</td>
      <td style="font-size:11px">${workers.join(', ')||'<span style="color:var(--t3)">—</span>'}</td>
      <td class="mono">${totalItems||'—'}</td>
      <td class="mono">${totalQty||'—'}</td>
      <td class="mono" style="color:var(--teal)">${totalPallets?fmtPallets(totalPallets):'—'}</td>
      <td class="mono" style="color:var(--blue)">${totalNet?fmtMin(totalNet):'—'}</td>
      <td>${stagePills(o.id)}</td>
      <td style="padding-right:10px"><button class="btn btn-sm" style="padding:2px 6px;font-size:10px" onclick="showOrderDetail('${o.id}')"><i class="ri-eye-line"></i></button></td>
    </tr>`;
  });

  document.getElementById('dashTable').innerHTML=`<div class="card" style="padding:0;overflow-x:auto">
    <table class="tbl" style="min-width:750px"><thead><tr>
      <th style="padding-left:12px">Order</th><th>Ch.</th><th>Customer</th><th>Workers</th>
      <th>Items</th><th>QTY</th><th>Pallets</th><th>Net time</th><th>Stage</th><th></th>
    </tr></thead><tbody>${trs.join('')}</tbody></table></div>`;

  const pg=document.getElementById('dashPager');
  pg.innerHTML=pages>1?`<button class="btn btn-sm" onclick="_dp--;renderDashTable()" ${_dp===0?'disabled':''}><i class="ri-arrow-left-s-line"></i></button><span style="font-size:11px;color:var(--t2)">${_dp+1}/${pages} (${total})</span><button class="btn btn-sm" onclick="_dp++;renderDashTable()" ${_dp>=pages-1?'disabled':''}><i class="ri-arrow-right-s-line"></i></button>`:`<span style="font-size:11px;color:var(--t3)">${total} order${total>1?'s':''}</span>`;
}

window.showOrderDetail=function(oid){
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  const ws=S.works.filter(w=>w.oid===oid);
  let html=`<div style="margin-bottom:14px"><div style="font-size:15px;font-weight:700">${oid}</div><div style="font-size:12px;color:var(--t2)">${o.ch} · ${o.cu}</div></div>`;
  ['PICK','INSP','PALL'].forEach(stage=>{
    const sw=ws.filter(w=>w.stage===stage);if(!sw.length)return;
    const col=SCOL[stage];
    html+=`<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:${col};letter-spacing:.06em;margin-bottom:5px">${stage}</div>`;
    sw.forEach((w,i)=>{
      const done=!!w.endT;
      const detail=stage==='PICK'?`${w.items} items · ${w.qty} QTY`:(w.pallets!==null&&done?`${fmtPallets(w.pallets)} pallets`:'');
      html+=`<div style="background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:8px 11px;margin-bottom:4px;font-size:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600">${w.w}</span>
          ${done?`<span class="badge b-done">Done · ${fmtMin(w.netMin)}</span>`:`<span class="badge b-live">Active</span>`}
        </div>
        <div style="color:var(--t3);margin-top:2px">${w.startT}${done?' → '+w.endT:' → now'} · ${detail}</div>
      </div>`;
    });
    html+='</div>';
  });
  if(!ws.length)html+='<div class="empty"><i class="ri-inbox-line"></i>No work entries</div>';
  html+=`<div style="text-align:right;margin-top:12px"><button class="btn btn-sm" onclick="closeModal()">Close</button></div>`;
  openModal(html);
};

// ══════════════════════════════════════════════════════
// WORK PAGE — each tab shows ONLY that stage's content
// ══════════════════════════════════════════════════════

function selStage(s) {
  CS = s;
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('on'));
  document.querySelector(`.stab.${s.toLowerCase()}`)?.classList.add('on');
  renderStageContent();
}

R.work = function() {
  updateTabStatus();
  renderStageContent();
};

function updateTabStatus() {
  ['PICK','INSP','PALL'].forEach(s => {
    const el  = document.getElementById('stabStatus_' + s); if (!el) return;
    const mine = S.works.filter(w => w.w === CW && w.stage === s && !w.endT);
    const tab  = document.querySelector(`.stab.${s.toLowerCase()}`); if (!tab) return;
    const dot  = tab.querySelector('.stab-dot');
    if (mine.length > 0) {
      el.textContent = mine.length + ' active';
      el.style.color   = SCOL[s];
      el.style.opacity = '1';
      if (!dot) { const d=document.createElement('div'); d.className='stab-dot'; tab.appendChild(d); }
    } else {
      el.textContent = '';
      if (dot) dot.remove();
    }
  });
}

function renderStageContent() {
  const container = document.getElementById('stageContent'); if (!container) return;
  updateTabStatus();
  const s    = CS;
  const col  = SCOL[s];
  const bdcl = SBGCLS[s];
  const icon = SICON[s];

  // My active sessions for THIS stage only
  const mySessions = S.works.filter(w => w.w===CW && w.stage===s && !w.endT);

  // ── Active sessions section ──
  let activeSect = '';
  if (mySessions.length > 0) {
    activeSect += mySessions.map(w => {
      const o   = S.orders.find(x=>x.id===w.oid);
      const inf = !!_pending[w.id];
      const elapsed = w.startT ? liveElapsed(w.startT) : '';
      return `
      <div class="session-card ${bdcl}" id="sc_${w.id}" style="margin-bottom:10px">
        <div class="session-top">
          <div>
            <div class="session-title">${w.oid}</div>
            <div class="session-sub">${o?.ch||''} · ${o?.cu||''}</div>
          </div>
          ${inf ? '<span class="badge b-saving"><i class="ri-loader-4-line"></i> Saving...</span>'
                : `<span class="badge b-live"><i class="ri-record-circle-line"></i> ${s} Active</span>`}
        </div>
        <div class="session-chips">
          ${s==='PICK'&&w.items ? `<span class="chip"><i class="ri-box-3-line"></i> ${w.items} items</span><span class="chip"><i class="ri-stack-line"></i> ${w.qty} QTY</span>` : ''}
          <span class="chip"><i class="ri-play-line"></i> Started ${w.startT||'—'}</span>
          ${elapsed ? `<span class="chip hi" id="elapsed_${w.id}"><i class="ri-timer-line"></i> ${elapsed}</span>` : `<span id="elapsed_${w.id}"></span>`}
        </div>
        <button class="btn btn-green btn-block btn-lg" onclick="endWork('${w.id}','${s}')" ${inf?'disabled':''}>
          <i class="ri-checkbox-circle-line"></i> ${SELABEL[s]}
        </button>
      </div>`;
    }).join('');
    activeSect = `<div style="margin-bottom:6px">

// Live timer
let _timerInterval = null;
function startSessionTimer() {
  if (_timerInterval) return;
  _timerInterval = setInterval(() => {
    if (curPage() !== 'work') return;
    S.works.filter(w => w.w===CW && !w.endT && w.startT).forEach(w => {
      const el = document.getElementById('elapsed_' + w.id); if (!el) return;
      const t = liveElapsed(w.startT);
      if (t) el.innerHTML = `<i class="ri-timer-line"></i> ${t}`;
    });
  }, 60000);
}

function liveElapsed(startHHmm) {
  if (!startHHmm) return '';
  try {
    const nm = clientNet(startHHmm, nowHHmm());
    return nm !== null ? fmtMin(nm) + ' elapsed' : '';
  } catch(_) { return ''; }
}

function doStartWork(oid, items, qty) {
  const tid=genId(), hhmm=nowHHmm();
  const entry={id:tid,oid,w:CW,stage:CS,items,qty,pallets:null,startT:hhmm,endT:'',startISO:'',endISO:'',netMin:null,grossMin:null,date:todayStr()};
  S.works.push(entry); _pending[tid]=true;
  toast(`✓ ${CS} started!`,'ok');
  updateBadges(); renderStageContent();

  apiBg('startWork',{orderId:oid,worker:CW,stage:CS,items,qty},
    res=>{
      const idx=S.works.findIndex(w=>w.id===tid);
      if(idx>=0&&res.entryId){S.works[idx].id=res.entryId;S.works[idx].startT=res.startTime||hhmm;}
      delete _pending[tid]; updateBadges(); renderStageContent();
    },
    ()=>{
      S.works=S.works.filter(w=>w.id!==tid);
      delete _pending[tid]; toast('⚠ Save failed — try again','err');
      updateBadges(); renderStageContent();
    }
  );
}

// Round to nearest 0.5 — rule: < 0.5 fraction → round down to .5, >= 0.5 fraction → round up to 1.0
// e.g. 0.3→0.5, 0.7→1.0, 1.3→1.5, 3.2→3.5, 3.6→4.0
function roundPallets(v){
  if(isNaN(v)||v<=0)return 0;
  const floor=Math.floor(v);
  const frac=v-floor;
  if(frac===0)   return floor;          // exact integer
  if(frac<0.5)   return floor+0.5;      // < half → round to .5
  return floor+1;                        // >= half → round up
}
function fmtPallets(v){
  if(v===null||v===undefined||v==='')return'—';
  const n=Number(v);
  return Number.isInteger(n)?n.toString():n.toFixed(1);
}

// helpers called by modal buttons
window.setPalletVal=function(v){
  const el=document.getElementById('palletCount');if(!el)return;
  el.value=v;updatePalletPreview();
};
window.adjPallet=function(delta){
  const el=document.getElementById('palletCount');if(!el)return;
  const cur=parseFloat(el.value)||0;
  el.value=Math.max(0,+(cur+delta).toFixed(1));
  updatePalletPreview();
};
window.updatePalletPreview=function(){
  const el=document.getElementById('palletCount');
  const prev=document.getElementById('palletPreview');
  if(!el||!prev)return;
  const raw=parseFloat(el.value);
  if(isNaN(raw)||raw<0){prev.textContent='';return;}
  const rounded=roundPallets(raw);
  if(rounded===raw){prev.innerHTML=`<span style="color:var(--green)">✓ Saved as <strong>${fmtPallets(rounded)}</strong> pallet${rounded!==1?'s':''}</span>`;}
  else{prev.innerHTML=`<span style="color:var(--amber)">→ Rounded to <strong>${fmtPallets(rounded)}</strong> pallet${rounded!==1?'s':''}</span>`;}
};

window.confirmEnd=function(wid,stage){
  const raw=parseFloat(document.getElementById('palletCount')?.value);
  const pallVal=isNaN(raw)||raw<0?0:roundPallets(raw);
  closeModal();
  doEndWork(wid,pallVal);
};

function doEndWork(wid,pallets){
  const w=S.works.find(x=>x.id===wid);if(!w||_pending[wid])return;
  const hhmm=nowHHmm();
  const orig={endT:w.endT,netMin:w.netMin,pallets:w.pallets};
  const nm=clientNet(w.startT,hhmm);
  w.endT=hhmm;w.netMin=nm;if(pallets!==null)w.pallets=pallets;
  _pending[wid]=true;

  showCompletionCard(wid, w, nm, pallets, hhmm);
  updateBadges(); renderStageContent();
  if(curPage()==='dash') R.dash();

  apiBg('endWork',{entryId:wid,pallets:pallets!==null?pallets:undefined},
    res=>{
      if(res.endTime)    w.endT   = res.endTime;
      if(res.netMinutes !== undefined && res.netMinutes !== null) w.netMin = res.netMinutes;
      if(res.pallets    !== null && res.pallets !== undefined)    w.pallets = res.pallets;
      delete _pending[wid];
      renderStageContent();
      if(curPage()==='dash') R.dash();
    },
    ()=>{ Object.assign(w,orig); delete _pending[wid]; toast('⚠ Save failed — try again','err'); renderStageContent(); }
  );
}

function renderKPI(){
  const from=document.getElementById('kpiFrom').value;
  const to  =document.getElementById('kpiTo').value;
  if(!from||!to){document.getElementById('kpiContent').innerHTML='<div class="empty">Select date range</div>';return;}

  // filter completed entries in range using startISO date
  const done=S.works.filter(w=>{
    if(!w.endT)return false;
    const d=w.startISO?w.startISO.slice(0,10):(w.date||'');
    if(!d)return true;
    return d>=from&&d<=to;
  });

  const label=from===to?from:`${from} ~ ${to}`;
  if(!done.length){document.getElementById('kpiContent').innerHTML=`<div class="empty"><i class="ri-bar-chart-2-line"></i>No completed entries for ${label}</div>`;return;}

  // Build stats: worker → stage → {sessions,items,qty,pallets,netMin}
  const stats={};
  S.workers.forEach(wk=>{stats[wk]={PICK:{n:0,items:0,qty:0,pallets:0,min:0},INSP:{n:0,items:0,qty:0,pallets:0,min:0},PALL:{n:0,items:0,qty:0,pallets:0,min:0}};});

  done.forEach(w=>{
    if(!stats[w.w])stats[w.w]={PICK:{n:0,items:0,qty:0,pallets:0,min:0},INSP:{n:0,items:0,qty:0,pallets:0,min:0},PALL:{n:0,items:0,qty:0,pallets:0,min:0}};
    const st=stats[w.w][w.stage];if(!st)return;
    st.n++;
    st.items  +=(w.items||0);
    st.qty    +=(w.qty||0);
    st.pallets+=(w.pallets||0);
    st.min    +=(w.netMin||0);
  });

  const totItems=done.filter(w=>w.stage==='PICK').reduce((s,w)=>s+(w.items||0),0);
  const totQty  =done.filter(w=>w.stage==='PICK').reduce((s,w)=>s+(w.qty||0),0);
  const totPall =done.filter(w=>['INSP','PALL'].includes(w.stage)).reduce((s,w)=>s+(w.pallets||0),0);
  const totMin  =done.reduce((s,w)=>s+(w.netMin||0),0);

  let html=`<div style="font-size:11px;color:var(--t3);margin-bottom:10px"><i class="ri-calendar-line"></i> ${label} — <strong style="color:var(--t2)">${done.length}</strong> completed sessions</div>
  <div class="g4" style="margin-bottom:14px">
    ${[{l:'Sessions done',v:done.length,c:'gr'},{l:'Items picked',v:totItems,c:'pu'},
       {l:'QTY picked',v:totQty,c:'tl'},{l:'Pallets (INSP+PALL)',v:fmtPallets(totPall),c:'am'}]
    .map(m=>`<div class="mc ${m.c}"><div class="mc-l">${m.l}</div><div class="mc-v" style="font-size:18px;color:var(--${{gr:'green',pu:'purple',tl:'teal',am:'amber'}[m.c]})">${m.v}</div></div>`).join('')}</div>`;

  // Net time summary card
  html+=`<div class="mc bl" style="margin-bottom:14px;padding:14px 16px"><div class="mc-l">Total net work time (lunch excluded)</div><div class="mc-v" style="font-size:20px;color:var(--blue)">${fmtMin(totMin)}</div></div>`;

  // Worker × Stage breakdown
  html+=`<div class="section">Worker × Stage — detail</div>
  <div class="card" style="padding:0;overflow-x:auto"><table class="tbl" style="min-width:680px">
  <thead><tr>
    <th style="padding-left:12px">Worker</th><th>Stage</th>
    <th>Sessions</th><th>Items</th><th>QTY</th><th>Pallets</th>
    <th>Net time</th><th>Avg/session</th><th>Speed</th>
  </tr></thead><tbody>`;

  const workerTotals=[];
  Object.entries(stats).forEach(([wk,stages])=>{
    const totN=Object.values(stages).reduce((s,v)=>s+v.n,0);if(!totN)return;
    const tI=Object.values(stages).reduce((s,v)=>s+v.items,0);
    const tQ=Object.values(stages).reduce((s,v)=>s+v.qty,0);
    const tP=Object.values(stages).reduce((s,v)=>s+v.pallets,0);
    const tM=Object.values(stages).reduce((s,v)=>s+v.min,0);
    workerTotals.push({wk,totN,tI,tQ,tP,tM});
    let first=true;
    ['PICK','INSP','PALL'].forEach(stage=>{
      const st=stages[stage];if(!st.n)return;
      const avg=Math.round(st.min/st.n);
      const speed=stage==='PICK'&&st.min?Math.round(st.items/st.min*60):stage!=='PICK'&&st.min&&st.pallets?+(st.pallets/st.min*60).toFixed(1):null;
      const speedStr=speed?speed+(stage==='PICK'?' i/hr':' pall/hr'):'—';
      html+=`<tr${wk===CW?' style="background:rgba(59,130,246,.03)"':''}>
        <td style="padding-left:12px;font-weight:${first?700:400};${!first?'color:transparent':''}">
          ${wk}${wk===CW?' <span style="color:var(--blue);font-size:9px">YOU</span>':''}
        </td>
        <td><span style="color:${SCOL[stage]};font-weight:700;font-size:11px">${stage}</span></td>
        <td class="mono">${st.n}</td>
        <td class="mono" style="color:var(--purple)">${st.items||'—'}</td>
        <td class="mono" style="color:var(--teal)">${st.qty||'—'}</td>
        <td class="mono" style="color:var(--amber)">${st.pallets?fmtPallets(st.pallets):'—'}</td>
        <td class="mono" style="color:var(--blue)">${fmtMin(st.min)}</td>
        <td class="mono">${avg?fmtMin(avg):'—'}</td>
        <td class="mono" style="color:var(--green)">${speedStr}</td>
      </tr>`;
      first=false;
    });
  });
  html+=`</tbody></table></div>`;

  // Worker totals summary
  html+=`<div class="section">Worker totals</div>
  <div class="card" style="padding:0;overflow-x:auto"><table class="tbl" style="min-width:560px">
  <thead><tr><th style="padding-left:12px">Worker</th><th>Sessions</th><th>Items picked</th><th>Pallets (INSP+PALL)</th><th>Net time</th><th>Bar</th></tr></thead><tbody>`;
  const maxI=Math.max(...workerTotals.map(x=>x.tI),1);
  workerTotals.sort((a,b)=>b.tI-a.tI).forEach(({wk,totN,tI,tQ,tP,tM})=>{
    const bar=Math.round(tI/maxI*100);
    html+=`<tr${wk===CW?' style="background:rgba(59,130,246,.03)"':''}>
      <td style="padding-left:12px;font-weight:700">${wk}${wk===CW?' <span style="color:var(--blue);font-size:9px">YOU</span>':''}</td>
      <td class="mono">${totN}</td>
      <td class="mono" style="color:var(--purple);font-weight:600">${tI}</td>
      <td class="mono" style="color:var(--amber)">${tP?fmtPallets(tP):'—'}</td>
      <td class="mono" style="color:var(--blue)">${fmtMin(tM)}</td>
      <td><div style="display:flex;align-items:center;gap:7px">
        <div style="width:90px;height:5px;background:var(--bg3);border-radius:3px"><div style="height:100%;width:${bar}%;background:var(--green);border-radius:3px"></div></div>
        <span style="font-size:10px;color:var(--t3)">${bar}%</span>
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;

  // Stage leaderboard
  html+=`<div class="section">Stage leaderboard</div><div class="g3">`;
  ['PICK','INSP','PALL'].forEach(stage=>{
    const col=SCOL[stage];
    const metric=stage==='PICK'?'items':'pallets';
    const rows=S.workers.map(wk=>{const st=stats[wk]?.[stage]||{n:0,items:0,qty:0,pallets:0,min:0};return{wk,...st};})
      .filter(x=>x.n>0).sort((a,b)=>b[metric]-a[metric]);
    const maxV=rows[0]?.[metric]||1;
    html+=`<div class="card" style="padding:14px"><div style="font-size:11px;font-weight:700;color:${col};letter-spacing:.06em;margin-bottom:10px">${stage} — ${stage==='PICK'?'by items':'by pallets'}</div>`;
    rows.forEach((r,i)=>{
      const v=r[metric];const bar=Math.round(v/maxV*100);
      html+=`<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span>${['🥇','🥈','🥉'][i]||''} <span style="font-weight:${r.wk===CW?700:400}">${r.wk}</span></span>
          <span class="mono" style="color:${col}">${stage==='PICK'?v:fmtPallets(v)} ${metric}</span>
        </div>
        <div style="height:4px;background:var(--bg3);border-radius:3px"><div style="height:100%;width:${bar}%;background:${col};border-radius:3px"></div></div>
      </div>`;
    });
    if(!rows.length)html+=`<div style="font-size:11px;color:var(--t3)">No data</div>`;
    html+=`</div>`;
  });
  html+=`</div>`;

  document.getElementById('kpiContent').innerHTML=html;
}

// ── MANAGER ──
R.mgr=function(){
  document.getElementById('workerList').innerHTML=S.workers.map(w=>
    `<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px">
      <span>${w}${w===CW?' <span style="color:var(--blue);font-size:10px">(you)</span>':''}</span>
      <button class="btn btn-sm" style="color:var(--red);border-color:var(--red-bd);padding:2px 6px" onclick="delWorker('${w}')"><i class="ri-delete-bin-line"></i></button></div>`).join('');

  document.getElementById('orderList').innerHTML=S.orders.map(o=>{
    const ws=S.works.filter(w=>w.oid===o.id),act=ws.filter(w=>!w.endT).length;
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px">
      <div><span class="mono" style="font-weight:700">${o.id}</span> <span style="color:var(--t3)">${o.ch}·${o.cu}</span>${act?` <span class="badge b-live" style="font-size:9px;margin-left:4px">${act} live</span>`:''}</div>
      <div style="display:flex;gap:4px">
        <button class="btn btn-sm" style="padding:2px 6px" onclick="editOrder('${o.id}')"><i class="ri-edit-line"></i></button>
        <button class="btn btn-sm" style="color:var(--red);border-color:var(--red-bd);padding:2px 6px" onclick="delOrder('${o.id}')"><i class="ri-delete-bin-line"></i></button>
      </div></div>`;
  }).join('')||'<div style="font-size:12px;color:var(--t3)">No orders</div>';
  renderEntries();
};

window.addWorker=function(){
  const n=document.getElementById('newWorker').value.trim();
  if(!n){toast('Enter name','err');return;}if(S.workers.includes(n)){toast('Already exists','err');return;}
  S.workers.push(n);apiBg('setSettings',{workers:S.workers});
  popWorker();toast(n+' added','ok');document.getElementById('newWorker').value='';R.mgr();
};
window.delWorker=function(n){
  if(!confirm(`Remove "${n}"?`))return;
  S.workers=S.workers.filter(w=>w!==n);apiBg('setSettings',{workers:S.workers});
  popWorker();toast(n+' removed','ok');R.mgr();
};
window.addOrder=function(){
  const id=document.getElementById('newOrderId').value.trim();
  const ch=document.getElementById('newOrderCh').value.trim()||'-';
  const cu=document.getElementById('newOrderCu').value.trim()||'-';
  if(!id){toast('Enter order #','err');return;}if(S.orders.find(o=>o.id===id)){toast('Already exists','err');return;}
  S.orders.push({id,ch,cu,at:''});toast(id+' added','ok');
  document.getElementById('newOrderId').value='';document.getElementById('newOrderCh').value='';document.getElementById('newOrderCu').value='';
  R.mgr();
  apiBg('upsertOrder',{id,ch,cu},()=>{},()=>{S.orders=S.orders.filter(o=>o.id!==id);toast('⚠ Save failed','err');R.mgr();});
};
window.delOrder=function(id){
  if(!confirm(`Delete "${id}" and all its entries?`))return;
  const bkO=[...S.orders],bkW=[...S.works];
  S.orders=S.orders.filter(o=>o.id!==id);S.works=S.works.filter(w=>w.oid!==id);
  toast(id+' deleted','ok');R.mgr();
  apiBg('deleteOrder',{id},()=>{},()=>{S.orders=bkO;S.works=bkW;toast('⚠ Delete failed','err');R.mgr();});
};
window.editOrder=function(oid){
  const o=S.orders.find(x=>x.id===oid);if(!o)return;
  openModal(`<div style="font-size:15px;font-weight:700;margin-bottom:14px"><i class="ri-edit-line" style="color:var(--amber)"></i> Edit order</div>
    <div class="fg"><label class="fl">Order number</label><input class="fi" id="eoId" value="${o.id}"></div>
    <div class="frow"><div class="fg"><label class="fl">Channel</label><input class="fi" id="eoCh" value="${o.ch}"></div><div class="fg"><label class="fl">Customer</label><input class="fi" id="eoCu" value="${o.cu}"></div></div>
    <div style="display:flex;gap:7px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-blue btn-sm" onclick="saveOrder('${oid}')"><i class="ri-check-line"></i> Save</button>
    </div>`);
};
window.saveOrder=function(orig){
  const newId=document.getElementById('eoId').value.trim();
  const ch=document.getElementById('eoCh').value.trim();
  const cu=document.getElementById('eoCu').value.trim();
  if(!newId){toast('Order # required','err');return;}
  const o=S.orders.find(x=>x.id===orig);if(o){o.id=newId;o.ch=ch;o.cu=cu;}
  S.works.filter(w=>w.oid===orig).forEach(w=>w.oid=newId);
  toast('Updated','ok');closeModal();R.mgr();
  apiBg('upsertOrder',{id:orig,newId:newId!==orig?newId:undefined,ch,cu});
};
window.renderEntries=function(){
  const q=(document.getElementById('entrySearch')?.value||'').toUpperCase();
  const ws=q?S.works.filter(w=>w.oid.toUpperCase().includes(q)||w.w.toUpperCase().includes(q)):S.works.slice(0,50);
  document.getElementById('entryTable').innerHTML=ws.length?
    `<table class="tbl"><thead><tr><th>Order</th><th>Worker</th><th>Stage</th><th>Items</th><th>QTY</th><th>Pallets</th><th>Start</th><th>End</th><th>Net</th><th></th></tr></thead><tbody>${
      ws.map(w=>`<tr>
        <td class="mono">${w.oid}</td><td>${w.w}</td>
        <td><span style="color:${SCOL[w.stage]||'var(--t)'};font-weight:700;font-size:11px">${w.stage}</span></td>
        <td class="mono">${w.items!==null?w.items:'—'}</td>
        <td class="mono">${w.qty!==null?w.qty:'—'}</td>
        <td class="mono" style="color:var(--amber)">${w.pallets!==null?fmtPallets(w.pallets):'—'}</td>
        <td class="mono">${w.startT||'—'}</td><td class="mono">${w.endT||'—'}</td>
        <td class="mono" style="color:var(--teal)">${fmtMin(w.netMin)}</td>
        <td><button class="btn btn-sm" style="color:var(--red);padding:2px 5px" onclick="delEntry('${w.id}')"><i class="ri-delete-bin-line"></i></button></td>
      </tr>`).join('')}</tbody></table>`
    :'<div style="font-size:12px;color:var(--t3);padding:8px 0">No entries</div>';
};
window.delEntry=function(wid){
  if(!confirm('Delete this entry?'))return;
  const bk=S.works.find(w=>w.id===wid);
  S.works=S.works.filter(w=>w.id!==wid);toast('Deleted','ok');renderEntries();
  apiBg('deleteEntry',{entryId:wid},()=>{},()=>{if(bk)S.works.push(bk);toast('⚠ Delete failed','err');renderEntries();});
};
window.changePin=function(){
  const c=document.getElementById('cpCur').value,n=document.getElementById('cpNew').value,cf=document.getElementById('cpConf').value;
  if(!c||!n||!cf){toast('Fill all fields','err');return;}
  if(c!==S.pin){toast('Wrong current password','err');return;}
  if(n.length<4){toast('Min 4 chars','err');return;}
  if(n!==cf){toast("Passwords don't match",'err');return;}
  S.pin=n;toast('Password changed','ok');
  ['cpCur','cpNew','cpConf'].forEach(id=>document.getElementById(id).value='');
  apiBg('setSettings',{managerPin:n});
};

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(async function init(){
  updateClock();setInterval(updateClock,1000);
  const ok=await loadData();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('app').style.display='block';
  if(!ok)toast('Failed to connect — check API URL','err');
  popWorker();
  document.querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>go(b.dataset.p)));
  go('dash');
  updateBadges();
  // Auto-refresh every 30s — skips if saves in-flight
  setInterval(async()=>{
    if(Object.keys(_pending).length===0){
      await loadData();updateBadges();
      const p=curPage();if(p==='dash')R.dash();else if(p==='work'){renderMyActive();renderActFeed();}
    }
  },30000);
  if('serviceWorker'in navigator){
    if('caches'in window)caches.keys().then(ns=>ns.forEach(n=>caches.delete(n)));
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
